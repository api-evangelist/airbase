description: >-
  FinOps view of Airbase (Airbase by Paylocity). Airbase is itself a spend
  management platform, so there are two cost lenses. (1) Cost of Airbase: a
  contract-priced SaaS subscription (quote-based, packaged by company size and
  modules enabled) rather than a usage-metered API bill - the developer API is
  an entitlement of the platform, not a separately metered product. (2) Airbase
  as a FinOps/spend-visibility tool: the platform and its API surface the very
  spend data (bills, cards, transactions, reimbursements, POs, GL coding) that a
  finance/FinOps team uses to allocate and control non-payroll spend. No numeric
  vendor rates are reconciled here.
notes: >-
  Airbase does not publish public per-unit API pricing; the platform is
  contract-priced. Verify current packaging with Airbase/Paylocity sales. This
  file models the cost/allocation shape, not confirmed invoice line items.
