meters:
- name: platform_subscription
  description: Contract-priced platform subscription; packaged by company size and modules enabled. Not usage-metered per API call.
  unit: contract
  aggregation: flat
  dimensions:
  - account
  - modules
- name: managed_spend_volume
  description: Total non-payroll spend managed through Airbase (bills, cards, reimbursements) - the value the platform governs, not a vendor fee.
  unit: currency
  aggregation: sum
  dimensions:
  - account
  - department
  - vendor
  - gl_code
principles:
- name: Visibility
  description: Use the Transactions, Bills, Cards, and Reimbursements APIs to surface all non-payroll spend in real time with GL coding.
- name: Allocation
  description: Map spend to departments, vendors, budgets, and GL codes via the platform's coding and the API's transaction data.
- name: Optimization
  description: Enforce pre-approval and policy via the Approvals and Purchase Requests workflows to prevent off-policy spend before it happens.
- name: Accountability
  description: Assign approvers and budget owners; reconcile card and bill spend against budgets during the monthly close.
