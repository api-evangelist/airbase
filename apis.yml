aid: airbase
url: https://raw.githubusercontent.com/api-evangelist/airbase/refs/heads/main/apis.yml
name: Airbase
kind: company
description: Airbase is a modern spend management platform for finance teams that
  combines accounts-payable (AP) automation and bill pay, guided procurement and
  purchase orders, corporate cards, and expense reimbursements on a single system
  with real-time general-ledger sync. Airbase Inc. was acquired by Paylocity in a
  ~$325M deal announced September 4, 2024 and completed October 1, 2024, and now
  operates as "Airbase by Paylocity," extending Paylocity's HCM suite into the
  office of the CFO. Airbase exposes a developer platform at developer.airbase.io
  (REST API reference, OpenAPI/Swagger, Postman and Insomnia collections, a
  webhooks management API, an OAuth playground, and a sandbox) used to build
  custom connections for systems not covered by the pre-built integrations. API
  access is account-gated - credentials are generated inside the customer's
  Airbase/Paylocity tenant rather than through open self-serve signup - so the
  logical APIs below are honestly modeled from the documented product surface and
  developer portal, and the exact endpoint paths and base URL are not publicly
  reproduced here (endpointsModeled).
