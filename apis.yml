    reimbursement surface; account-gated (endpointsModeled).
- aid: airbase:airbase-approvals-api
  name: Airbase Approvals API
  tags:
  - Approvals
  - Workflows
  - Policy
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.airbase.io/
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  - url: https://www.airbase.com/
    type: Website
  description: Inspect and act on the multi-step approval workflows that gate
    purchase requests, bills, cards, and reimbursements - approvers, policy rules,
    current state, and milestone transitions. Approval milestone changes are also
    delivered as webhook events. Endpoints modeled from the documented approvals
