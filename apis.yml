  - Virtual Cards
  - Card Programs
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.airbase.io/
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  - url: https://www.airbase.com/
    type: Website
  description: Access Airbase corporate and virtual card programs - list cards,
    card holders, spend limits and controls, and their associated policies - to
    reconcile card spend against budgets and the general ledger. Endpoints modeled
    from the documented corporate-card product surface; account-gated
