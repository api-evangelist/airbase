- aid: airbase:airbase-gl-accounting-sync-api
  name: Airbase GL & Accounting Sync API
  tags:
  - General Ledger
  - Accounting
  - ERP Sync
  - GL Coding
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://www.airbase.com/sheets/erp-integration-api
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  - url: https://www.airbase.com/integrations-overview
    type: Website
  description: Read and push general-ledger coding and accounting records so spend
    stays in sync with the ERP/GL. Airbase promotes a REST API specifically for
    building custom ERP/GL connections for systems not on its pre-built
    integration list. Endpoints modeled from the documented ERP-integration/GL-sync
    surface; account-gated (endpointsModeled).
- aid: airbase:airbase-webhooks-api
  name: Airbase Webhooks Management API
  tags:
  - Webhooks
  - Events
  - Subscriptions
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.airbase.io/
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  description: Register and manage webhook subscriptions so external systems
    receive Airbase events - for example a purchase request being approved or a
    workflow transitioning through a milestone - as JSON payloads (id, object,
    type, created_date, data). A webhooks management API is documented on the
    Airbase developer portal. Endpoints modeled from the documented webhook
    surface; account-gated (endpointsModeled).
