apis:
- aid: airbase:airbase-bills-ap-api
  name: Airbase Bills & AP Automation API
  tags:
  - Bills
  - Accounts Payable
  - Bill Pay
  - Invoices
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.airbase.io/
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  - url: https://www.airbase.com/
    type: Website
  description: Programmatically create, list, retrieve, and update bills and vendor
    invoices flowing through Airbase's AP automation - including bill line items,
    approval state, payment status, and payment method - to automate pre-approval,
    payment, and accounting workflows. Endpoints are honestly modeled from the
    documented AP/bill-pay product surface; access is account-gated
    (endpointsModeled).
- aid: airbase:airbase-purchase-orders-api
  name: Airbase Purchase Requests & Orders API
  tags:
  - Purchase Requests
  - Purchase Orders
  - Procurement
  - Intake
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.airbase.io/
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  - url: https://www.airbase.com/
    type: Website
  description: Create and track guided purchase requests and purchase orders,
    including intake details, line items, vendor and GL coding, budget checks, and
    the approval milestones a request transitions through. Airbase emits webhook
    events such as "purchase request approved" as requests move through their
    workflow. Endpoints modeled from the documented procurement surface;
    account-gated (endpointsModeled).
- aid: airbase:airbase-vendors-api
  name: Airbase Vendors API
  tags:
  - Vendors
  - Suppliers
  - Master Data
  image: https://kinlane-images.s3.amazonaws.com/shared/apis-json/apis-json-logo.jpg
  humanURL: https://developer.airbase.io/
  properties:
  - url: https://developer.airbase.io/
    type: Documentation
  - url: https://vendors.airbase.io/
    type: Website
  description: Manage the vendor/supplier master record - create, list, retrieve,
    and update vendors, their payment details, tax and onboarding information, and
    the relationships that bills, purchase orders, and payments are made against.
    Airbase also runs a separate vendor portal at vendors.airbase.io. Endpoints
    modeled from the documented vendor-management surface; account-gated
    (endpointsModeled).
- aid: airbase:airbase-cards-api
  name: Airbase Corporate Cards API
  tags:
